server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    port_in_redirect off;
    absolute_redirect off;
    server_name_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type text/html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/geo+json
        application/schema+json
        application/xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Public CORS for JSON Schemas and Open Datasets
    location ^~ /schemas/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ^~ /data/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Direct Clean Route Handling Without 301 Port Redirects
    location = /demo {
        try_files /demo/index.html =404;
    }
    location = /demo/ {
        try_files /demo/index.html =404;
    }

    location = /tools {
        try_files /tools/index.html =404;
    }
    location = /tools/ {
        try_files /tools/index.html =404;
    }

    location = /ordinances {
        try_files /ordinances/index.html =404;
    }
    location = /ordinances/ {
        try_files /ordinances/index.html =404;
    }

    location = /mcp {
        try_files /mcp/index.html =404;
    }
    location = /mcp/ {
        try_files /mcp/index.html =404;
    }

    location = /spec {
        try_files /spec/index.html =404;
    }
    location = /spec/ {
        try_files /spec/index.html =404;
    }

    # Clean URL Fallback
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
